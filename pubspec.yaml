name: rawdah_maktaba
description: Islamic learning platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  http: ^1.1.0
  url_launcher: ^6.2.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  google_sign_in: ^6.2.1

  # PDF viewer
  flutter_pdfview: ^1.3.2

  # PDF thumbnail extraction (uses Android built-in renderer)
  pdf_render: ^1.4.6

  # Audio playback
  just_audio: ^0.9.40

  # Audio background service + notification media controls
  just_audio_background: ^0.0.1-beta.13

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/covers/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
