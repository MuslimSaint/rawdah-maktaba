def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.gms.google-services'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace "com.rawda.library"
    compileSdkVersion 35
    ndkVersion "26.1.10909125"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.rawda.library"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    // ═══════════════════════════════════════════════════
    // Release signing config.
    // Reads from environment variables set by GitHub
    // Actions (RELEASE_KEYSTORE_PATH, RELEASE_STORE_PASSWORD,
    // RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD).
    // Falls back to debug keystore for local builds where
    // these env vars are not set — so nothing breaks locally.
    // ═══════════════════════════════════════════════════
    signingConfigs {
        release {
            def keystorePath = System.getenv("RELEASE_KEYSTORE_PATH")
            def storePwd = System.getenv("RELEASE_STORE_PASSWORD")
            def keyAlias = System.getenv("RELEASE_KEY_ALIAS")
            def keyPwd = System.getenv("RELEASE_KEY_PASSWORD")

            if (keystorePath != null && file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword storePwd
                keyAlias keyAlias
                keyPassword keyPwd
            }
        }
    }

    buildTypes {
        release {
            // If release keystore is available (CI build),
            // use it. Otherwise fall back to debug keystore
            // so local builds still work.
            def hasReleaseKeystore = System.getenv("RELEASE_KEYSTORE_PATH") != null &&
                                     file(System.getenv("RELEASE_KEYSTORE_PATH") ?: "/nonexistent").exists()
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'
}
