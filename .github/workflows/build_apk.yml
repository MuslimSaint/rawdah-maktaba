name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build universal release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build split APKs per ABI
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: rawdah-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: rawdah-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload armeabi APK
        uses: actions/upload-artifact@v4
        with:
          name: rawdah-armeabi-apk
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: rawdah-x86_64-apk
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30
