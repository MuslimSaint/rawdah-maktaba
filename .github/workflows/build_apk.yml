name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      # ══════════════════════════════════════════════════
      # TEMPORARY STEP — GENERATE RELEASE KEYSTORE
      # After we save the base64 + SHA-1 as secrets,
      # this whole block will be REMOVED.
      # ══════════════════════════════════════════════════
      - name: Generate RELEASE keystore (ONE-TIME)
        run: |
          echo "═══════════════════════════════════════════════"
          echo "GENERATING RELEASE KEYSTORE"
          echo "═══════════════════════════════════════════════"
          
          mkdir -p ~/keystores
          
          keytool -genkey -v \
            -keystore ~/keystores/release.keystore \
            -alias rawdah \
            -keyalg RSA \
            -keysize 2048 \
            -validity 25000 \
            -storepass "${{ secrets.RELEASE_PASSWORD_TEMP }}" \
            -keypass "${{ secrets.RELEASE_PASSWORD_TEMP }}" \
            -dname "CN=Rawdah Project, O=Rawdah Project, C=ET"
          
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "RELEASE KEYSTORE BASE64 — COPY THIS ENTIRE STRING"
          echo "═══════════════════════════════════════════════"
          echo ""
          base64 -w 0 ~/keystores/release.keystore
          echo ""
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "END OF BASE64"
          echo "═══════════════════════════════════════════════"
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "SHA-1 AND SHA-256 FINGERPRINTS — COPY SHA-1"
          echo "═══════════════════════════════════════════════"
          echo ""
          keytool -list -v \
            -keystore ~/keystores/release.keystore \
            -alias rawdah \
            -storepass "${{ secrets.RELEASE_PASSWORD_TEMP }}" \
            -keypass "${{ secrets.RELEASE_PASSWORD_TEMP }}" | grep -E "SHA1:|SHA256:"
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "END OF FINGERPRINTS"
          echo "═══════════════════════════════════════════════"

      - name: Set up keystore
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using stored keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore
            echo "Keystore loaded. Fingerprints:"
            keytool -list -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android | grep -E "SHA1:|SHA256:"
          else
            echo "No keystore secret found. Generating new keystore..."
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo ""
            echo "=== COPY THIS BASE64 ==="
            base64 -w 0 ~/.android/debug.keystore
            echo ""
            echo "========================"
            echo ""
            echo "=== FINGERPRINTS ==="
            keytool -list -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android | grep -E "SHA1:|SHA256:"
            echo "===================="
          fi

      - name: Show Flutter version
        run: flutter --version

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build universal release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build split APKs per ABI
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Get version info
        id: version
        run: |
          echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha }}
          name: Build ${{ steps.version.outputs.date }}
          body: |
            🕌 مكتبة الروضة — Automatic build
            
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            
            ### Download:
            - `app-release.apk` — Universal (works on all devices)
            - `app-arm64-v8a-release.apk` — Modern phones (smaller)
            - `app-armeabi-v7a-release.apk` — Older phones
            - `app-x86_64-release.apk` — Emulators
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
