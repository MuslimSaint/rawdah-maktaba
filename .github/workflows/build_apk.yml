name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      # ══════════════════════════════════════════════════
      # Load RELEASE keystore from GitHub Secrets.
      # This is what signs the APK with your permanent key.
      # ══════════════════════════════════════════════════
      - name: Load release keystore
        run: |
          mkdir -p ~/keystores
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > ~/keystores/release.keystore
          
          # Verify keystore loaded correctly by printing SHA-1
          echo "Release keystore loaded. SHA-1:"
          keytool -list -v \
            -keystore ~/keystores/release.keystore \
            -alias rawdah \
            -storepass "${{ secrets.RELEASE_STORE_PASSWORD }}" \
            -keypass "${{ secrets.RELEASE_KEY_PASSWORD }}" | grep "SHA1:"

      # ══════════════════════════════════════════════════
      # Keep the old debug keystore setup for compatibility
      # with anything that might still reference it.
      # ══════════════════════════════════════════════════
      - name: Set up debug keystore (fallback)
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore
          else
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Show Flutter version
        run: flutter --version

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      # ══════════════════════════════════════════════════
      # Build APKs with RELEASE keystore signing.
      # The env vars here are read by android/app/build.gradle
      # which uses them to sign the release build.
      # ══════════════════════════════════════════════════
      - name: Build universal release APK
        env:
          RELEASE_KEYSTORE_PATH: /home/runner/keystores/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: rawdah
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build split APKs per ABI
        env:
          RELEASE_KEYSTORE_PATH: /home/runner/keystores/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: rawdah
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Get version info
        id: version
        run: |
          echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha }}
          name: Build ${{ steps.version.outputs.date }}
          body: |
            🕌 مكتبة الروضة — Automatic build
            
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Signed with:** Release keystore
            
            ### Download:
            - `app-release.apk` — Universal (works on all devices)
            - `app-arm64-v8a-release.apk` — Modern phones (smaller)
            - `app-armeabi-v7a-release.apk` — Older phones
            - `app-x86_64-release.apk` — Emulators
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
