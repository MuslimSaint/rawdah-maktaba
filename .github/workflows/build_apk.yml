name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Set up keystore
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using stored keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore
            echo "Keystore loaded. Fingerprints:"
            keytool -list -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android | grep -E "SHA1:|SHA256:"
          else
            echo "No keystore secret found. Generating new keystore..."
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo ""
            echo "=== COPY THIS BASE64 ==="
            base64 -w 0 ~/.android/debug.keystore
            echo ""
            echo "========================"
            echo ""
            echo "=== FINGERPRINTS ==="
            keytool -list -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android | grep -E "SHA1:|SHA256:"
            echo "===================="
          fi

      - name: Show Flutter version
        run: flutter --version

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build universal release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build split APKs per ABI
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Get version info
        id: version
        run: |
          echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha }}
          name: Build ${{ steps.version.outputs.date }}
          body: |
            🕌 مكتبة الروضة — Automatic build
            
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            
            ### Download:
            - `rawdah-universal.apk` — works on all Android devices
            - `rawdah-arm64.apk` — for modern phones (smaller size)
            - `rawdah-armeabi.apk` — for older phones
            - `rawdah-x86_64.apk` — for emulators
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename APK files in release
        run: |
          echo "✅ APKs uploaded to GitHub Release"
          echo "Universal APK: build/app/outputs/flutter-apk/app-release.apk"
          echo "arm64 APK: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
