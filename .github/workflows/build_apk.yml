name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Set up keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using stored keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore
          else
            echo "No keystore secret found. Generating new keystore..."
            mkdir -p ~/.android
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo ""
            echo "=== COPY THIS BASE64 — SAVE AS GITHUB SECRET KEYSTORE_BASE64 ==="
            base64 -w 0 ~/.android/debug.keystore
            echo ""
            echo "================================================================="
            echo ""
            echo "=== SHA-1 TO REGISTER IN FIREBASE ==="
            keytool -list -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android | grep "SHA1:"
            echo "====================================="
          fi

      - name: Show Flutter version
        run: flutter --version

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build universal release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build split APKs per ABI
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: rawdah-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: rawdah-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: Upload armeabi APK
        uses: actions/upload-artifact@v4
        with:
          name: rawdah-armeabi-apk
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: rawdah-x86_64-apk
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30
